<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - Jerry Barber</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./js/auth.js" type="module" defer></script>
    <script src="./js/perfil.js" type="module" defer></script>
</head>
<body class="body-login">
    <script>
        // Protección de Ruta
        if (!localStorage.getItem('jerry_user_session')) {
            window.location.href = 'login.html';
        }
    </script>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark shadow fixed-top">
            <div class="container">
                <a class="navbar-brand" href="./index.html#home">
                    <img src="./assets/logo2.jpg" alt="Logo Jerry Barber" width="300px">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarResponsive">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="./index.html#home">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="./index.html#about">About</a></li>
                        <li class="nav-item"><a class="nav-link" href="./index.html#servicios">Servicios</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="login-main">
        <div class="container">
            <div class="card login-card">
                <div class="card-body">
                    <h2 class="card-title text-center mb-4">Mi Perfil</h2>

                    <!-- Información del Usuario -->
                    <div class="mb-4">
                        <h4>Información de la Cuenta</h4>
                        <p><strong>Nombre:</strong> <span id="profile-name"></span></p>
                        <p><strong>Email:</strong> <span id="profile-email"></span></p>
                    </div>

                    <!-- Editar Perfil -->
                    <div class="mb-4">
                        <h4>Editar Información</h4>
                        <form id="edit-profile-form">
                            <div class="mb-3">
                                <label for="newName" class="form-label">Nuevo Nombre</label>
                                <input type="text" id="newName" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-primary">Actualizar Nombre</button>
                        </form>
                    </div>

                    <!-- Cambiar Contraseña -->
                    <div class="mb-4">
                        <h4>Cambiar Contraseña</h4>
                        <form id="change-password-form">
                            <div class="mb-3">
                                <label for="currentPassword" class="form-label">Contraseña Actual</label>
                                <input type="password" id="currentPassword" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label for="newPassword" class="form-label">Nueva Contraseña</label>
                                <input type="password" id="newPassword" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-warning">Cambiar Contraseña</button>
                        </form>
                    </div>

                    <!-- Mis Turnos -->
                    <div>
                        <h4>Mis Próximos Turnos</h4>
                        <div class="table-responsive">
                            <table class="table table-dark table-hover">
                                <thead>
                                    <tr>
                                        <th>Fecha y Hora</th>
                                        <th>Servicio</th>
                                    </tr>
                                </thead>
                                <tbody id="turnos-perfil-rows">
                                    <!-- Las filas de los turnos se insertarán aquí -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="login-footer">
        <div class="container">
            <p class="text-center text-white-50">&copy; 2023 Jerry Barber. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
